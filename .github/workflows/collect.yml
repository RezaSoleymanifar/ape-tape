name: collect

# Hourly. Each run appends one observation and commits it, so the commit
# timestamp records when the reading happened. Free on public repositories;
# the job is a few seconds and a few kilobytes.

on:
  schedule:
    - cron: "7 * * * *"        # seven past, to stay off the crowded top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false     # never drop an observation to start a newer one

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10           # a hung read must not hold the hour's slot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet httpx

      - name: Read the boards
        run: python collect.py

      # The raw response is the only thing that cannot be rebuilt later. This
      # step exists because it once was not committed at all: the run wrote it
      # to the runner's disk and the runner was then destroyed. A silent gap
      # in the archive is worse than a failed job, so this fails the job.
      - name: The raw response must exist
        run: |
          today=$(date -u '+%Y-%m-%d')
          n=$(ls data/raw/"$today"/*.json.gz 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "collect.py wrote no raw file for $today. Refusing to record a"
            echo "derived line with nothing behind it."
            exit 1
          fi
          echo "raw files for $today: $n"

      - name: Commit the observation
        run: |
          git config user.name  "ape-tape"
          git config user.email "actions@github.com"
          git add data/raw data/tape.jsonl docs/latest.json docs/series.json
          if git diff --cached --quiet; then
            echo "nothing changed, the feed returned the same numbers"
            exit 0
          fi
          git commit -m "tape: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another hour's commit, or a hand edit, may have landed meanwhile.
          git pull --rebase --autostash origin main
          git push
