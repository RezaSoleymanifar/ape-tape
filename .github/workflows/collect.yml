name: collect

# Hourly. Each run appends one reading and commits it, so the commit timestamp
# records when the reading happened. Free on public repositories; the job is a
# few seconds and a few kilobytes.
#
# Two schedules, not one. GitHub runs cron on a best-effort queue and drops
# ticks under load, and this repository went nineteen hours without a single
# scheduled run. A second attempt half an hour later gives every hour two
# chances to be recorded. `--min-gap 45` means the second attempt does nothing
# when the first one worked, so the tape stays hourly either way.

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false     # never drop an observation to start a newer one

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10         # a hung read must not hold the hour's slot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet httpx

      - name: Read the boards
        run: python collect.py --min-gap 45

      # The raw response is the only thing that cannot be rebuilt later. This
      # step exists because it once was not committed at all: the run wrote it
      # to the runner's disk and the runner was then destroyed. A derived line
      # with nothing behind it is worse than no line, so this fails the job.
      - name: A reading must have its raw response
        run: |
          set -euo pipefail
          tape=$(git status --porcelain -- 'data/tape/*.jsonl' | wc -l)
          raw=$(git status --porcelain -- data/raw | wc -l)
          if [ "$tape" -eq 0 ]; then
            echo "no new reading this run, nothing to check"
            exit 0
          fi
          if [ "$raw" -eq 0 ]; then
            echo "A reading was appended with no raw response behind it."
            echo "Refusing to commit a tape that cannot be rebuilt."
            exit 1
          fi
          echo "reading and raw response both present"

      - name: Commit the reading
        run: |
          set -euo pipefail
          git config user.name  "ape-tape"
          git config user.email "actions@github.com"
          git add data/raw data/tape docs/latest.json docs/series.json
          if git diff --cached --quiet; then
            echo "nothing changed, no reading was taken this run"
            exit 0
          fi
          git commit -m "tape: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # The reading now exists only in this commit, on a runner that is
          # about to be destroyed. Another hour, or a hand edit, may have
          # landed upstream in the meantime, so rebase and try again rather
          # than lose it to a single rejected push.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "could not push the reading after five attempts."
          exit 1
